<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Ingresar · Soluna Cloud</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
:root{color-scheme:dark}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100svh;margin:0;padding:24px;background:#0a0a0a;color:#fafafa;font:400 14px/20px Inter,system-ui,sans-serif;font-feature-settings:"clig" 0,"liga" 0}.card{width:min(100%,416px);padding:32px;border:1px solid #262626;border-radius:10px;background:#0a0a0a;box-shadow:0 8px 10px #0005;animation:up .5s both}.mark{display:grid;place-items:center;width:40px;height:40px;margin-bottom:24px;border:1px solid #262626;border-radius:8px;background:transparent;color:#fafafa;font-size:30px;line-height:1}.brand{font-size:18px;font-weight:500;letter-spacing:-.5px}.brand span{margin-left:8px;color:#a1a1a1;font-weight:400}.eyebrow{margin-top:32px;color:#737373;font-size:10px;font-weight:500;line-height:20px;letter-spacing:1px}.card h1{margin:16px 0;font-size:24px;font-weight:600;line-height:28px;letter-spacing:-.4px}.card p{margin:0 0 24px;color:#a1a1a1;font-size:14px;line-height:20px}label{display:block;margin:0 0 8px;color:#a1a1a1;font-size:14px;font-weight:500}input{width:100%;height:44px;padding:0 12px;border:1px solid #464646;border-radius:10px;outline:0;background:#0a0a0a;color:#fafafa;font:inherit}input::placeholder{color:#737373}input:focus{border-color:#a1a1a1;box-shadow:0 0 0 2px #ffffff0d}button{width:100%;min-height:40px;margin-top:16px;padding:8px 16px;border:1px solid #ffffff1a;border-radius:8px;background:#e5e5e5;color:#171717;font:500 14px/20px Inter,system-ui,sans-serif;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px #0000001a;cursor:pointer;transition:background .18s}button:hover{background:#fafafa}button:focus-visible{outline:2px solid #a1a1a1;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#error{min-height:20px;margin-top:16px;color:#e5b6b6;font-size:12px;line-height:18px}.foot{margin-top:16px;padding-top:16px;border-top:1px solid #262626;color:#737373;font-size:12px;line-height:18px}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.card{padding:24px}input{font-size:16px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-visual-style="graphite">
  <main class="card">
    <div class="mark" aria-hidden="true">☾</div>
    <div class="brand">soluna<span>cloud</span></div>
    <div class="eyebrow">TU WORKSPACE PRIVADO</div>
    <h1>Qué bueno verte.</h1>
    <p>Ingresá la contraseña de acceso de tu espacio para abrir Soluna.</p>
    <form id="login-form">
      <label for="token">Contraseña de acceso</label>
      <input id="token" type="password" autocomplete="current-password" autofocus required placeholder="Ingresá tu token privado" />
      <button id="submit" type="submit">Entrar a Soluna <span aria-hidden="true">→</span></button>
      <div id="error" role="status" aria-live="polite"></div>
    </form>
    <div class="foot">El acceso se guarda como una cookie segura en este navegador. No compartas tu token.</div>
  </main>
  <script>
    const form=document.querySelector('#login-form'),input=document.querySelector('#token'),button=document.querySelector('#submit'),error=document.querySelector('#error');
    form.addEventListener('submit',async(event)=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Verificando…';try{const response=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:input.value})});if(!response.ok)throw new Error('El token no es válido. Revisá el valor e intentá de nuevo.');location.replace('/');}catch(err){error.textContent=err.message;button.disabled=false;button.innerHTML='Entrar a Soluna <span aria-hidden="true">→</span>';input.focus();}});
  </script>
</body>
</html>
